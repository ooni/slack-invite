{{template "top" .}}
<p>Join <strong>{{.Workspace}}</strong> on Slack.</p>
<p>Ask for an invitation and we'll email you one.</p>
{{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
<form method="post" action="/">
  <label class="visually-hidden" for="email">Email address</label>
  <input class="form-item" id="email" name="email" type="email" placeholder="you@yourdomain.com"
         required maxlength="254" autocomplete="email" autofocus value="{{.Email}}">
  <label class="visually-hidden" for="note">What brings you to {{.Workspace}}? (optional)</label>
  <textarea class="form-item" id="note" name="note" maxlength="1000"
            placeholder="What brings you to {{.Workspace}}? (optional)">{{.Note}}</textarea>
  <div class="hp" aria-hidden="true">
    <label for="website">Leave this empty</label>
    <input id="website" name="website" tabindex="-1" autocomplete="off">
  </div>
  <button type="submit">Request my invite</button>
</form>
{{if .SignInURL}}<p class="signin">or <a href="{{.SignInURL}}" target="_top">sign in</a>.</p>{{end}}
{{template "bottom" .}}
