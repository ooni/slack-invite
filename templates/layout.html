{{define "top"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join {{.Workspace}} on Slack</title>
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --bg: #f5f6f8; --card: #fff; --accent: #0588cb; --muted: #5f6368; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e8eaed; --bg: #16181b; --card: #22252a; --muted: #9aa0a6; --accent: #3fa9f5; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 26rem; margin: 1rem; padding: 2rem; background: var(--card); border-radius: 12px; text-align: center;
         box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); }
  h1 { font-size: 1.4rem; margin: 0 0 0.75rem; }
  p { color: var(--muted); margin: 0 0 1.25rem; }
  form { text-align: left; }
  label { display: block; font-weight: 600; margin: 0 0 0.3rem; }
  label span { font-weight: 400; color: var(--muted); }
  input, textarea { box-sizing: border-box; width: 100%; margin: 0 0 1rem; padding: 0.6rem; border: 1px solid var(--muted);
                    border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; }
  textarea { min-height: 5rem; resize: vertical; }
  button { width: 100%; padding: 0.7rem; border: 0; border-radius: 8px; background: var(--accent); color: #fff;
           font: inherit; font-weight: 600; cursor: pointer; }
  input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .error { color: #c5221f; font-weight: 600; }
  @media (prefers-color-scheme: dark) { .error { color: #f28b82; } }
  .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
  small { display: block; margin-top: 1.25rem; color: var(--muted); }
  small a { color: inherit; }
</style>
</head>
<body>
<main>
{{end}}

{{define "bottom"}}
</main>
</body>
</html>
{{end}}
