{{define "top"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join {{.Workspace}} on Slack!</title>
<link rel="icon" href="/assets/favicon-32.png">
<style>
  /* The look of slackin, which this replaces */
  html, body { margin: 0; padding: 0; height: 100%; }
  html { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
         font-size: 10px; background-color: #fff; color: #000; }
  body { display: flex; align-items: center; justify-content: center; padding: 1rem 1.6rem 3.2rem;
         box-sizing: border-box; position: relative; }
  .splash { width: 30rem; max-width: 100%; text-align: center; }
  .logos { position: relative; margin-bottom: 4rem; }
  .logo { display: inline-block; }
  .logo.org { margin-right: 7rem; }
  .logo.org img { border-radius: .56em; }
  .logo.org::after { position: absolute; display: block; content: "+"; top: 1.5rem; left: 0; width: 100%;
                     text-align: center; color: #ccc; font-size: 1.5rem; }
  p { font-size: 1.5rem; margin: .5rem 0; }
  form { margin-top: 2rem; margin-bottom: 0; }
  .form-item, button { font-size: 1.2rem; margin-top: 1rem; display: block; box-sizing: border-box; width: 100%; padding: .9rem; }
  .form-item { color: #333; border: .1rem solid #ccc; font-family: inherit; text-align: center; }
  textarea.form-item { text-align: left; min-height: 6rem; resize: vertical; }
  .form-item::placeholder { color: #999; }
  .form-item:focus { border-color: #666; outline: 0; }
  button { color: #fff; font-family: inherit; font-weight: 700; border-width: 0; background-color: #e01563;
           text-transform: uppercase; cursor: pointer; appearance: none; transition: background-color .15s ease-in; }
  button:active { background-color: #9a0e44; }
  button:focus-visible { outline: .2rem solid #e01563; outline-offset: .2rem; }
  .error { color: #f4001e; font-size: 1.3rem; margin-top: 1.5rem; }
  p.signin { padding: 1rem 0; font-size: 1.1rem; }
  p.signin a, footer a { color: #e01563; text-decoration: none; }
  p.signin a:hover, footer a:hover { background-color: #e01563; color: #fff; }
  footer { color: #999; font-size: 1.1rem; width: 30rem; max-width: 100%; text-align: center;
           position: absolute; bottom: 1rem; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
</style>
</head>
<body>
<div class="splash">
<div class="logos">
  <div class="logo org"><img src="/assets/org-logo.png" alt="{{.Workspace}}'s logo" width="48" height="48"></div>
  <div class="logo slack"><img src="/assets/slack.svg" alt="Slack's logo" width="48" height="48"></div>
</div>
{{end}}

{{define "bottom"}}
</div>
{{if .ContactEmail}}<footer>Trouble joining? Email <a href="mailto:{{.ContactEmail}}">{{.ContactEmail}}</a></footer>{{end}}
</body>
</html>
{{end}}
